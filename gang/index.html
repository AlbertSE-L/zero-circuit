<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帮派 · 金库夜班</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c1a;color:#eeeade;font:16px/1.55 system-ui}main{max-width:780px;margin:auto;padding:22px}header,section{padding:18px;border:1px solid #53645c;background:#192c26;margin:12px 0;border-radius:12px}small{color:#b1c7ba}h1,h2{margin:4px 0;color:#f6d791}button,input{font:inherit;padding:9px 12px;margin:4px;border-radius:8px;border:1px solid #70887b}button{background:#e9d398;color:#172219;cursor:pointer}button.on{background:#91d8bd}button:disabled{opacity:.5}input{max-width:90%}b.card{display:inline-block;color:#21221c;background:#fff2d9;padding:8px;margin:3px;border-radius:5px}.chip{border-radius:50%;min-width:45px}#err{color:#ffba9a;position:sticky;top:0;background:#202821}details{margin:12px 0}label{display:block}:root{color-scheme:dark}body{background:radial-gradient(#38303e 1px,transparent 1px) 0 0/9px 9px,#16131b;color:#fff4e5}
header,section{background:#242029;border:1px solid #736375;border-radius:2px 16px 2px 2px;box-shadow:4px 4px #08070a}
header{border-left:7px solid #ff4979;background:linear-gradient(150deg,#27222e 65%,#532535)}
h1,h2{color:#ffe16a;font-weight:900}small,.picks{color:#ff94b0}.tools{margin:14px 0;border-left:3px solid #ff527c;padding-left:8px}
button,select,input{font:inherit;border-radius:4px}button{background:#ffe16a;color:#241b24;border-color:#574656}
button.on{background:#fc779c;color:#1d1119}select,input{max-width:100%;background:#312b36;color:#fff4e5;padding:8px}
button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style><main><header><a href="/" style="color:#ffe16a">← 游戏大厅</a><br><small>THE NIGHT SHIFT　/　合作推理</small><h1>桌边行动台</h1>选择行动，召集队友。</header><div id="err" role="status"></div><div id="table"></div><details><summary>桌边规则</summary>3–6 人，每人两张底牌。四轮公共牌依次为 0、3、4、5 张。每人认领一个名次，1 最弱；可拿走别人的筹码，原持有人回到待选。不得透露牌面或暗示具体实力。全员确认后进入下一轮。最终按河牌轮筹码顺序摊牌，七张中选最佳五张，同牌型比踢脚，完全平手可互换。排对一局开一座金库，排错响一次警报，五局三胜提前结束。</details></main><script type="module">
const table=document.querySelector('#table'),err=document.querySelector('#err'),mods=await(await fetch('/gang/mods')).json();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=h=>h.map(c=>'<b class="card">'+esc(c)+'</b>').join('');
let state,session=JSON.parse(sessionStorage.getItem('gang')||'null'),busy=false,show=false;
const phases=['底牌','翻牌','转牌','河牌'];
function home(){table.innerHTML='<section><small>01 / SELECT GAME</small><h2>选择游戏</h2><label>本桌游戏 <select id="game"><option value="gang">帮派 · 金库夜班（3–6 人）</option><option value="zero">零点回路（2–5 人）</option></select></label><div id="gang-form"><label>你的昵称 <input id="name" maxlength="16"></label><button data-c="create">主持新桌</button><label>六位房号 <input id="code" inputmode="numeric" maxlength="6"></label><button data-c="join">加入游戏</button></div><button id="open-zero" data-c="zero" hidden>进入零点回路准备开房 →</button></section>'}
function btn(cmd,text,value='',attr=''){return '<button '+attr+' data-c="'+cmd+'" data-value="'+value+'">'+text+'</button>'}
function render(){let r=state,host=r.me===0,me=r.players[r.me],html='<section><small>房间 '+r.code+'　/　'+r.players.length+' 人</small><h2>金库 '+r.wins+'　·　警报 '+r.losses+'</h2>'+r.players.map(p=>esc(p.name)).join(' · ')+'</section>';
if(r.phase==='lobby'){html+='<section><h2>行动简报</h2>不选修正即为基础玩法。已选 '+r.mods.length+' 项。'+(host?'<div class="tools">'+['增益','减益'].map((group,i)=>btn('random',i?'随机 Debuff':'随机 Buff',group,Object.keys(mods).some(k=>mods[k][0]===group&&!r.mods.includes(k))?'':'disabled')).join('')+btn('undo','↶ 撤销上一个修正','',r.canUndo?'':'disabled')+'</div>':'')+'<p class="picks">'+(r.mods.map(k=>mods[k][1]).join(' · ')||'当前无修正')+'</p>'+['增益','减益'].map(group=>'<h3>'+group+'</h3>'+Object.entries(mods).filter(([,m])=>m[0]===group).map(([id,m])=>btn('mod',(r.mods.includes(id)?'✓ ':'')+m[1]+' · '+m[2],id,(host?'':'disabled')+(r.mods.includes(id)?' class="on"':''))).join('')).join('')+(host?btn('start','开始第一局','',r.players.length<3?'disabled':''):'等待房主开局')+'</section>'}
else {const end=r.phase==='result';html+='<section><small>'+phases[r.stage]+' / '+(r.mods.map(k=>mods[k][1]).join('、')||'基础玩法')+'</small><h2>公共牌</h2>'+(cards(r.board)||'尚未亮牌')+'</section>';
if(!end)html+='<section><h2>我的底牌</h2>'+btn('show',show?'盖住':'查看')+(show?cards(me.hand)+' '+esc(me.category):'')+'<h3>认领名次</h3>'+r.players.map((p,j)=>btn('chip',String(j+1),j+1,'class="chip '+(me.chip===j+1?'on':'')+'"')).join('')+btn('chip','退回',0)+'<p>已占用 '+r.occupied.join('、')+' · 我的名次 '+(me.chip||'待选')+'</p>'+btn('ready',r.ready.includes(r.me)?'已确认':'确认本轮排序','',r.occupied.length<r.players.length||r.ready.includes(r.me)?'disabled':'')+' '+r.ready.length+'/'+r.players.length+'</section>';
html+='<section><h2>'+(end?(r.success?'金库开启':'警报触发'):'队伍情报')+'</h2>'+(end?[...r.players].sort((a,b)=>a.chip-b.chip):r.players).map(p=>'<p><strong>'+esc(p.name)+'</strong> · '+(p.chip?'第 '+p.chip+' 位':'待定')+' '+(end?cards(p.hand)+' '+p.category:'')+' '+p.hints.join(' / ')+'</p>').join('')+(end?'实际从弱到强：'+[...r.players].sort((a,b)=>a.score-b.score).map(p=>esc(p.name)).join(' → '):'')+'</section>';
if(r.history.length)html+='<details><summary>历轮筹码</summary>'+r.history.map((row,j)=>'<p>'+phases[j]+'：'+row.map((v,k)=>esc(r.players[k].name)+' #'+v).join(' · ')+'</p>').join('')+'</details>';
if(end){const over=Math.max(r.wins,r.losses)===3;html+='<section><h2>'+(over?(r.wins===3?'团队胜利':'行动失败'):'本局结算')+'</h2>'+(host?btn(over?'again':'next',over?'再开一场':'下一局'):'等待房主')+'</section>'}}
table.innerHTML=html}
async function send(cmd,value){if(busy)return;busy=true;try{const body={...session,cmd,value,v:state?.v};if(['create','join'].includes(cmd)){body.name=document.querySelector('#name').value;body.code=document.querySelector('#code').value}
const result=await(await fetch('/gang/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();if(result.error){if(cmd==='read'&&['房间不存在','席位无效'].includes(result.error)){session=null;sessionStorage.removeItem('gang');home()}throw Error(result.error)}
if(result.token){session={token:result.token,code:result.code};sessionStorage.setItem('gang',JSON.stringify(session))}
if(session)localStorage.setItem('gang-last-seat',JSON.stringify(session));
if(cmd==='read' && err.dataset.connection){err.textContent='';delete err.dataset.connection}
if(!state||result.v!==state.v){if(state?.phase!==result.phase)show=false;state=result;render()}if(cmd!=='read')err.textContent='';}catch(e){if(e instanceof TypeError && session){err.dataset.connection='retry';err.textContent='连接中断，正在尝试恢复原座位…'}else err.textContent=e.message}finally{busy=false}}
table.onchange=e=>{if(e.target.id==='game'){const zero=e.target.value==='zero';document.querySelector('#gang-form').hidden=zero;document.querySelector('#open-zero').hidden=!zero}};
table.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c==='zero'){location.assign('/circuit');return}if(b.dataset.c==='show'){show=!show;render();return}send(b.dataset.c,b.dataset.c==='chip'?Number(b.dataset.value):b.dataset.value)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&show){show=false;render()}});
home();
if(!session && localStorage.getItem('gang-last-seat')){
 const saved=JSON.parse(localStorage.getItem('gang-last-seat'));
 const resume=document.createElement('button');
 resume.textContent='恢复最近座位 · '+saved.code;
 resume.onclick=()=>{session=saved;sessionStorage.setItem('gang',JSON.stringify(saved));send('read')};
 table.prepend(resume);
}
if(session)await send('read');setInterval(()=>{if(session)send('read')},1500)
</script></html>
